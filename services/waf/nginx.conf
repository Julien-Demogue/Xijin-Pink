# WAF — sole ingress (Consigne: pilier Cybersécurité).
# Reverse-proxies the frontend + business APIs, applies rate limiting and a
# pragmatic attack-pattern filter, and ships JSON access logs to Loki (service
# label = waf). It also forwards the real client IP (X-Forwarded-For), which the
# services' telemetry middleware records — so app logs carry the true source IP.
#
# This is a controllable lab WAF. To go full OWASP CRS, swap the image for
# owasp/modsecurity-crs:nginx and set BACKEND — see services/waf/README.md.

worker_processes auto;
events { worker_connections 1024; }

http {
  # Structured access log consumed by Loki/the SOC dashboard.
  log_format waf_json escape=json
    '{"timestamp":"$time_iso8601","service":"waf","level":"info",'
    '"message":"waf_access","method":"$request_method","route":"$uri",'
    '"status":"$status","request_time_s":"$request_time",'
    '"bytes_in":"$request_length","bytes_out":"$body_bytes_sent",'
    '"ip":"$remote_addr","user_agent":"$http_user_agent","request_id":"$request_id"}';
  access_log /dev/stdout waf_json;
  error_log /dev/stderr warn;

  server_tokens off;
  client_max_body_size 1m;
  client_body_timeout 10s;

  # Rate limiting lives at the WAF (the project's only place for it).
  limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
  limit_req_status 429;

  upstream frontend_up { server frontend:5173; }
  upstream auth_up     { server auth-service:3001; }
  upstream payment_up  { server payment-api:3002; }

  # Block obvious attack signatures in the path (traversal, SQLi, XSS, log4shell).
  map $request_uri $bad_path {
    default 0;
    "~*(\.\./|/etc/passwd|union[^a-z]+select|<script|onerror=|\$\{jndi:)" 1;
  }

  server {
    listen 8080;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Filtering: bad path patterns, SQLi/XSS in query args, non-standard methods.
    if ($bad_path) { return 403; }
    if ($args ~* "(union[^a-z]+select|'[^']*or[^']*'1'='1|<script|\.\./)") { return 403; }
    if ($request_method !~ ^(GET|POST|PUT|HEAD|OPTIONS)$) { return 405; }

    limit_req zone=perip burst=40 nodelay;

    location = /waf-health { access_log off; return 200 "ok\n"; }

    location /api/auth/ {
      proxy_pass http://auth_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/donations/ {
      proxy_pass http://payment_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
      proxy_pass http://frontend_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
