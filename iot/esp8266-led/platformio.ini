; ESP8266 bicolor-LED indicator for the back-office auth flow.
; Build/flash with PlatformIO (CLI or the JetBrains CLion + PlatformIO plugin).
; Also opens as-is in the Arduino IDE (rename src/main.cpp -> .ino).

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; No external libs: JSON is parsed minimally to keep the firmware tiny.
