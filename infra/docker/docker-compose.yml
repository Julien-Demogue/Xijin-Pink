name: xijin-pink

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - donnees_mariadb:/var/lib/mysql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interne]

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [interne]

  auth-service:
    build: ../../services/auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      PUBLIC_FRONT_URL: ${PUBLIC_FRONT_URL}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "3001:3001"
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [interne]

  payment-api:
    build: ../../services/payment-api
    restart: unless-stopped
    environment:
      PORT: 3002
      PUBLIC_FRONT_URL: ${PUBLIC_FRONT_URL}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PSP_URL: http://psp-simulator:3003
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET}
      PSP_RETURN_URL: ${PUBLIC_FRONT_URL}/don/retour
    ports:
      - "3002:3002"
    depends_on:
      mariadb:
        condition: service_healthy
      psp-simulator:
        condition: service_started
    networks: [interne]

  psp-simulator:
    build: ../../services/psp-simulator
    restart: unless-stopped
    environment:
      PORT: 3003
      PAYMENT_API_URL: http://payment-api:3002
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET}
      PUBLIC_URL: ${PUBLIC_PSP_URL}
      DEFAULT_RETURN_URL: ${PUBLIC_FRONT_URL}
    ports:
      - "3003:3003"
    networks: [interne]
  
  frontend:
    build: ../../frontend
    restart: unless-stopped
    environment:
      REACT_APP_AUTH_SERVICE_URL: http://auth-service:3001
      REACT_APP_PAYMENT_API_URL: http://payment-api:3002
      REACT_APP_PSP_URL: http://psp-simulator:3003
    ports:
      - "5173:5173"
    networks: [interne]
    command: >
      /bin/sh -c "npm run dev -- --host 0.0.0.0"

  # --- Cybersecurity: WAF (sole ingress, rate limiting, filtering) ---
  waf:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../services/waf/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"      # hotspot-facing ingress (frontend + APIs via the WAF)
    depends_on:
      - frontend
      - auth-service
      - payment-api
    networks: [interne]

  # --- Observability: metrics (Prometheus) + logs (Loki + Promtail) + Grafana ---
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"   # dev-only, like the other local mappings
    networks: [interne]

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    # Dev-only host mapping for the dataset exporter. Like the 3001-3003/8081
    # mappings, this is for local work; on the hotspot Loki stays internal.
    ports:
      - "3100:3100"
    networks: [interne]

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [interne]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    networks: [interne]

  # --- AI (opt-in): start with `docker compose --profile ai up` ---
  anomaly-detector:
    build: ../../ai/anomaly-detection
    restart: unless-stopped
    environment:
      LOKI_URL: http://loki:3100
      PROM_URL: http://prometheus:9090
      STEP_S: "5"
      MODEL_DIR: /app/model_store
      # REMEDIATION_URL: http://remediation-engine:9000/alerts   # when it exists
    volumes:
      # Model persisted here. On first start with none, the detector trains a
      # synthetic bootstrap model into it; `detector.train_eval` overwrites it
      # with a real one. Writable so the bootstrap can save.
      - ../../ai/anomaly-detection/model_store:/app/model_store
    ports:
      - "3010:3010"
    depends_on:
      - loki
    profiles: ["ai"]
    networks: [interne]

  rag-assistant:
    build: ../../ai/rag-assistant
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://host.docker.internal:11434   # Ollama runs on the host
      DETECTOR_URL: http://anomaly-detector:3010
      RAG_CORPUS_DIR: /app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../docs:/app/docs:ro
    ports:
      - "3020:3020"
    profiles: ["ai"]
    networks: [interne]

  face-auth:
    build: ../../services/face-auth
    restart: unless-stopped
    environment:
      AUTH_URL: http://auth-service:3001
      # ESP8266_URL: http://192.168.137.50   # the ESP's IP; unset = mock LED
    volumes:
      - face_data:/app/data        # biometric templates (persisted)
    ports:
      - "3005:3005"
    depends_on:
      - auth-service
    profiles: ["ai"]
    networks: [interne]

volumes:
  donnees_mariadb:
  loki_data:
  grafana_data:
  prometheus_data:
  face_data:

networks:
  interne:
    driver: bridge
